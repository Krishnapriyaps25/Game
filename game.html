<!DOCTYPE html>
<html ng-app="gameApp">
<head>
  <title>Game Module</title>

  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: #0b1220;
    color: #e5e7eb;
  }

  h2 {
    text-align: center;
    margin: 30px 0 10px;
    font-size: 32px;
    font-weight: 600;
    color: #c7d2fe;
  }

  /* Search box */
  input[type="text"] {
    display: block;
    margin: 20px auto;
    padding: 14px 16px;
    width: 360px;
    font-size: 16px;
    background: #111827;
    border: 1px solid #1f2937;
    color: #e5e7eb;
    border-radius: 8px;
  }

  input[type="text"]::placeholder {
    color: #9ca3af;
  }

  input[type="text"]:focus {
    border-color: #3b82f6;
  }

  p {
    text-align: center;
    color: #9ca3af;
    margin-bottom: 10px;
  }

  /* Buttons */
  button {
    display: block;
    margin: 10px auto;
    padding: 12px 22px;
    font-size: 15px;
    font-weight: 500;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  button:hover {
    background: #1d4ed8;
  }

  /* Game cards */
  .game-card {
    background: #111827;
    border: 1px solid #1f2937;
    padding: 20px;
    margin: 20px auto;
    width: 420px;
    border-radius: 12px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .game-card h3 {
    margin: 0 0 10px;
    font-size: 22px;
    color: #e0e7ff;
  }

  .game-card p {
    text-align: left;
    margin: 6px 0;
    font-size: 15px;
    color: #cbd5f5;
  }
  .hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
  }
</style>

</head>

<body ng-controller="gameController">

  <h2> Online Gaming Store</h2>
  <input type="text"
         ng-model="searchText"
         ng-focus="onFocus()"
         ng-blur="onBlur()"
         placeholder="Search games">

  <p>{{statusMessage}}</p>

  <button ng-click="sortByPrice()">Sort by Price</button>

  <br><br>
  <div class="game-card"
       ng-repeat="game in games | filter:searchText | orderBy:sortColumn"
       ng-mouseenter="hover=true"
       ng-mouseleave="hover=false"
       ng-class="{hover:hover}">

    <h3>{{game.name | uppercase}}</h3>
    <p>Genre: {{game.genre}}</p>
    <p>Price: {{game.price | currency}}</p>
    <p>Rating: {{game.rating}}</p>

    <button ng-click="playGame(game.name)">Play</button>

  </div>

<script>
angular.module("gameApp", [])
.controller("gameController", function($scope, $http) {


  $http.get("games.json").then(function(response) {
    $scope.games = response.data;
  });

  $scope.statusMessage = "";

 
  $scope.onFocus = function() {
    $scope.statusMessage = "Search box focused";
  };

  $scope.onBlur = function() {
    $scope.statusMessage = "Search box lost focus";
  };


  $scope.sortByPrice = function() {
    $scope.sortColumn = "price";
  };

  $scope.playGame = function(gameName) {
    alert("Starting game: " + gameName);
  };

});
</script>

</body>
</html>
