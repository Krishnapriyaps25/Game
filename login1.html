<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Éternel Realms - Login</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Poppins:wght@300;400&display=swap');
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: linear-gradient(-45deg, #01010a, #001a33, #001f4d, #000814);
    background-size: 400% 400%;
    animation: blueFlow 10s ease infinite;
    color: #e6e6e6;
}

@keyframes blueFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
.login-container {
    background: rgba(10, 15, 25, 0.9);
    padding: 50px;
    border-radius: 20px;
    text-align: center;
    width: 400px;
    box-shadow: 0 0 40px rgba(0,191,255,0.25);
    backdrop-filter: blur(10px);
    animation: fadeIn 1.5s ease;
    transition: all 0.4s ease;
    border: 1px solid rgba(0,191,255,0.2);
}

.login-container:hover {
    box-shadow: 0 0 60px rgba(0,191,255,0.4);
    transform: scale(1.02);
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}
.login-container h2 {
    color: #00bfff;
    margin-bottom: 25px;
    font-family: 'Cinzel Decorative', cursive;
    font-size: 34px;
    letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(0,191,255,0.6), 0 0 50px rgba(0,191,255,0.2);
}
.login-container input {
    width: 90%;
    padding: 15px;
    margin: 12px 0;
    border: 1px solid rgba(0,191,255,0.3);
    outline: none;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.05);
    color: #e6e6e6;
    font-size: 16px;
    transition: 0.4s ease;
}

.login-container input::placeholder {
    color: #a0b4c4;
}

.login-container input:focus {
    border-color: #00bfff;
    box-shadow: 0 0 12px #00bfff;
    transform: scale(1.02);
}
.login-container button {
    width: 95%;
    padding: 14px;
    background: linear-gradient(45deg, #0077ff, #00bfff);
    border: none;
    border-radius: 10px;
    color: #000;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 0 25px rgba(0,191,255,0.4);
}

.login-container button:hover {
    background: linear-gradient(45deg, #00bfff, #0077ff);
    box-shadow: 0 0 40px rgba(0,191,255,0.6);
    transform: scale(1.05);
}
.login-container a {
    color: #a0b4c4;
    font-size: 15px;
    text-decoration: none;
    display: block;
    margin-top: 15px;
    transition: 0.3s;
}

.login-container a:hover {
    color: #00bfff;
    text-shadow: 0 0 10px rgba(0,191,255,0.8);
}
.message {
    color: #e6e6e6;
    margin-top: 15px;
    font-size: 15px;
    height: 20px;
}
</style>
</head>
<body>

<div class="login-container">
    <h2>Éternel Realms</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Enter Realm</button>
        <div class="message" id="message"></div>
        <a href="#">Forgot your password?</a>
    </form>
</div>
<script>
const form = document.getElementById("loginForm");
const message = document.getElementById("message");

form.addEventListener("submit", function(event) {
  event.preventDefault();

  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value.trim();

  if (user === "" || pass === "") {
    showMessage("Please fill in both fields", "#00bfff");
    return;
  }

  const xhr = new XMLHttpRequest();
  xhr.open("POST", "login_server.php", true);
  xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        const response = JSON.parse(xhr.responseText);
        if (response.status === "success") {
          showMessage("Access Granted! Entering the Realm...", "#00ffcc");
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1800);
        } else {
          showMessage("Invalid credentials! Try again.", "#ff5555");
        }
      } else {
        showMessage("Server not responding!", "#ff5555");
      }
    }
  };

  xhr.send(`username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`);
});

function showMessage(text, color) {
  message.style.color = color;
  message.textContent = text;
}
</script>
</body>
</html><!php -S localhost:8000
http://localhost:8000/login1.html>
